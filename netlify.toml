# Direct navigation and refreshes on nested goods routes (e.g. /goods/product/x,
# /goods/collection) must serve the SPA shell so React Router can take over
# client-side — otherwise Netlify 404s on any /goods/* path that isn't a real
# file on disk. Scoped to /goods/* only; does not affect any other route.
[[redirects]]
  from = "/goods"
  to = "/goods/index.html"
  status = 200

[[redirects]]
  from = "/goods/*"
  to = "/goods/index.html"
  status = 200

# sites/ is a frontend-only Vite/React app (no backend, no Netlify Function),
# but the build step above still leaves sites/node_modules and the raw
# TS/TSX source sitting in the publish directory next to the built assets/
# output — same source-exposure issue as goods/ above, same fix. Placed
# before the SPA catch-all below so these take precedence (first-match-wins).
[[redirects]]
  from = "/sites/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sites/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sites/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sites/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sites/tsconfig.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sites/vite.config.ts"
  to = "/404.html"
  status = 404
  force = true

# Direct navigation to nested /sites client routes (e.g. /sites/dental,
# /sites/renovation, /sites/fitness, /sites/marriage-hall) must serve the
# SPA shell so React Router can take over client-side — otherwise Netlify
# 404s on any /sites/* path that isn't a real file on disk. Scoped to
# /sites/* only; does not affect any other route.
[[redirects]]
  from = "/sites"
  to = "/sites/index.html"
  status = 200

[[redirects]]
  from = "/sites/*"
  to = "/sites/index.html"
  status = 200
