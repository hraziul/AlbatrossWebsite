[build]
  publish = "."
  # The main site is static HTML/assets published as-is — unchanged.
  # The goods/ storefront is a separate Vite/React app; it has to be built,
  # and its output copied into goods/ (alongside the backend source already
  # there) so the built frontend publishes at /goods. This is additive, not
  # destructive — appCore.js and friends must survive this step, because the
  # Netlify Function below imports appCore.js directly from goods/ at
  # deploy time. (An earlier version of this command deleted goods/ and
  # replaced it with just the dist output — that broke the function import.)
  #
  # sites/ is the same pattern, minus the backend: a separate Vite/React app
  # (the 8th constellation star, "Albatross Sites") that also has to be built
  # and have its dist/ output copied back into sites/ so it publishes at
  # /sites. Its vite.config.ts already sets base: '/sites/' for production
  # builds, matching goods/vite.config.ts's convention.
  command = "npm --prefix goods ci && npm --prefix goods run build && cp -r goods/dist/. goods/ && rm -rf goods/dist && npm --prefix sites ci && npm --prefix sites run build && cp -r sites/dist/. sites/ && rm -rf sites/dist"

[build.environment]
  # ArtsyCheezein@gmail.com is shown on purpose in the storefront (footer
  # contact, checkout error-recovery messages, order confirmation page,
  # RequestDesign mailto: link) — real support UX, not an accident. It's
  # ALSO the literal value of these four env vars (used server-side as an
  # SMTP/Printrove login username and notification-routing address, not as
  # a password). Netlify's build-time secrets scan flags any configured env
  # var value found in public output regardless of whether that value is
  # actually sensitive, so it fails the build on this public, intentional
  # email address. Omit only these four non-password keys — the real
  # secrets (RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, SMTP_PASS,
  # PRINTROVE_PASSWORD, GEMINI_API_KEY) stay fully covered by the scan.
  SECRETS_SCAN_OMIT_KEYS = "PRINTROVE_EMAIL,SMTP_USER,FROM_EMAIL,MERCHANT_EMAIL"

[functions]
  directory = "netlify/functions"

# Backend API — previously nothing was deployed here at all, so every
# /api/* call from the live site 404'd (confirmed by testing the live URL
# directly). This routes /api/* to the Netlify Function that wraps the same
# Express app (appCore.js) used locally, so checkout/newsletter/returns work
# identically to `npm run dev:full`.
#
# No :splat here deliberately — for a rewrite (status 200) to a function,
# Netlify preserves the ORIGINAL request path in the function's event, so
# Express sees "/api/checkout/create-order" unchanged, matching appCore.js's
# routes with no path rewriting needed. (netlify/functions/api.js also
# defensively normalizes the path in case this behaves differently than
# expected — untested against a live Netlify deploy, worth confirming in the
# deploy's function logs after the first real request.)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# The build command above deliberately keeps goods/appCore.js and friends
# (backend source, npm dependency tree, raw TS source, sync scripts) sitting
# alongside the built frontend after copying goods/dist/ back in — required
# so the Netlify Function can still import appCore.js at deploy time (see
# the build command comment). With publish = ".", that means all of it is
# otherwise directly downloadable at /goods/*.js, /goods/node_modules/*, etc.
# None of it contains secrets (verified — see project history), and none of
# it is ever requested by the built frontend, which only ever fetches its
# own hashed assets/, /goods/products-cache*.json, /goods/themes/manifest.json,
# /goods/images/*, /goods/sitemap.xml, /goods/robots.txt. This is a source-
# exposure hardening, not a secrets fix — deny the backend-only paths so
# only the actual public site surface is servable. Placed before the SPA
# catch-all below so these take precedence (Netlify uses first-match-wins).
[[redirects]]
  from = "/goods/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/goods/src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/goods/scripts/*"
  to = "/404.html"
  status = 404
  force = true

